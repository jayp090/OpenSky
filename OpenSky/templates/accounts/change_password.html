{% extends 'base.html' %}
{% block title %}Change Password – Open Sky{% endblock %}

{% block content %}
<div class="breadcrumb mb-2">
    <a href="{% url 'settings' %}">Settings</a><span>›</span>Change Password
</div>
<div class="page-header"><h1>Change Password</h1></div>

<div class="card" style="max-width:480px;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Current Password</label>
            <input type="password" name="current_password" class="form-control" required placeholder="Enter current password">
        </div>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="new_password1" class="form-control" required placeholder="At least 8 characters">
        </div>
        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" name="new_password2" class="form-control" required placeholder="Repeat new password">
        </div>
        <div style="display:flex; gap:10px; margin-top:8px;">
            <button type="submit" class="btn btn-primary"><i class="bi bi-key"></i> Update Password</button>
            <a href="{% url 'settings' %}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
