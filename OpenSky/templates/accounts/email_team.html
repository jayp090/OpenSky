{% extends 'base.html' %}

{% block title %}Email Team - {{ team.name }}{% endblock %}
{% block page_title %}Send Email{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <h3>Message to {{ team.name }}</h3>
    <form method="post" style="margin-top: 20px;">
        {% csrf_token %}
        <div class="mb-4">
            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Subject</label>
            <input type="text" name="subject" class="form-control" placeholder="Re: Engineering Dependency" required>
        </div>
        <div class="mb-4">
            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Message</label>
            <textarea name="message" class="form-control" rows="6" placeholder="Write your message here..." required></textarea>
        </div>
        <button type="submit" class="btn-primary">Send Message</button>
        <a href="{% url 'team_detail' team.id %}" style="margin-left: 15px; color: #666; text-decoration: none;">Cancel</a>
    </form>
</div>
{% endblock %}
