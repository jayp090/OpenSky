{% extends 'base.html' %}

{% block title %}Schedule Meeting - {{ team.name }}{% endblock %}
{% block page_title %}Schedule Meeting{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <h3>Meeting with {{ team.name }}</h3>
    <form method="post" style="margin-top: 20px;">
        {% csrf_token %}
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="mb-4">
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Date</label>
                <input type="date" name="meeting_date" class="form-control" required>
            </div>
            <div class="mb-4">
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Time</label>
                <input type="time" name="meeting_time" class="form-control" required>
            </div>
        </div>
        <div class="mb-4">
            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Platform</label>
            <select name="platform" class="form-control" required>
                <option value="Microsoft Teams">Microsoft Teams</option>
                <option value="Slack Huddle">Slack Huddle</option>
                <option value="Zoom">Zoom</option>
                <option value="In-Person">In-Person</option>
            </select>
        </div>
        <div class="mb-4">
            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Additional Notes</label>
            <textarea name="message" class="form-control" rows="3" placeholder="Purpose of the meeting..."></textarea>
        </div>
        <button type="submit" class="btn-primary">Request Meeting</button>
        <a href="{% url 'team_detail' team.id %}" style="margin-left: 15px; color: #666; text-decoration: none;">Cancel</a>
    </form>
</div>
{% endblock %}
