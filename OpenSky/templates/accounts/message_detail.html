{% extends 'base.html' %}

{% block title %}View Message{% endblock %}
{% block page_title %}View Message{% endblock %}

{% block content %}
<h3>View Message</h3>
<div class="card">
    <h1>{{ message.subject }}</h1>
    <p>{{ message.sender }}, to {{ message.recipient }} </p><br>
    <p>{{ message.content }}</p><br>
    <p>{{ message.date }}</p>
</div>


{% endblock %}
