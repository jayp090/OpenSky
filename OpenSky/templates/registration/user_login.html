{% extends 'base.html' %}
{% load static %}

{% block title %}User Login - OpenSky{% endblock %}

{% block auth_content %}
<div class="card" style="width: 100%; max-width: 400px; padding: 40px;">
    <div style="text-align: center; margin-bottom: 30px;">
        <img src="{% static 'images/opensky_logo.png' %}" alt="OpenSky Logo" style="width: 60px; margin-bottom: 15px;">
        <h2 style="color: var(--secondary-color);">User Login</h2>
        <p style="color: #666;">Access the Engineering Directory</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label for="username" style="display: block; margin-bottom: 8px; font-weight: 600;">Username</label>
            <input type="text" name="username" id="username" class="form-control" placeholder="Enter your username" required>
        </div>
        <div class="mb-4">
            <label for="password" style="display: block; margin-bottom: 8px; font-weight: 600;">Password</label>
            <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; padding: 12px;">Sign In</button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
        <p>Don't have an account? <a href="{% url 'signup' %}" style="color: var(--primary-color); font-weight: 600;">Sign Up</a></p>
        <hr style="margin: 20px 0;">
        <a href="{% url 'admin_login' %}" style="font-size: 0.9rem; color: #666; text-decoration: none;">Are you an Admin? <span style="color: var(--primary-color);">Login here</span></a>
    </div>
</div>
{% endblock %}
