{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account – Open Sky</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background:#0d1b2e; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; font-family:'Inter',sans-serif; }
        .auth-brand { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:28px; }
        .auth-brand .os-badge { width:44px; height:44px; border-radius:8px; overflow:hidden; }
        .auth-brand .os-badge img { width:100%; height:100%; object-fit:contain; }
        .auth-brand .brand-text { color:#fff; }
        .auth-brand .brand-text h1 { font-size:1.1rem; font-weight:700; margin:0; }
        .auth-brand .brand-text p { font-size:0.7rem; margin:0; opacity:0.6; }
        .auth-card { background:#fff; border-radius:16px; padding:40px; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,0.4); }
        .auth-card h2 { font-size:1.5rem; font-weight:700; color:#1a1a2e; margin:0 0 6px; }
        .auth-card .subtitle { color:#6b7280; font-size:0.875rem; margin:0 0 28px; }
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; font-size:0.85rem; font-weight:600; color:#374151; margin-bottom:6px; }
        .input-wrap { position:relative; }
        .input-wrap input { width:100%; padding:11px 14px; border:1.5px solid #e5e7eb; border-radius:8px; font-size:0.9rem; font-family:inherit; box-sizing:border-box; outline:none; transition:border-color 0.2s; }
        .input-wrap input:focus { border-color:#E6007E; }
        .input-wrap .toggle-pw { position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; color:#9ca3af; font-size:1rem; }
        .btn-auth { width:100%; padding:12px; background:#E6007E; color:#fff; border:none; border-radius:8px; font-size:0.95rem; font-weight:600; cursor:pointer; font-family:inherit; transition:opacity 0.2s; margin-top:4px; }
        .btn-auth:hover { opacity:0.9; }
        .auth-footer { text-align:center; margin-top:24px; font-size:0.875rem; color:#6b7280; }
        .auth-footer a { color:#E6007E; font-weight:600; text-decoration:none; }
        .alert-error { background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; padding:10px 14px; border-radius:8px; font-size:0.875rem; margin-bottom:16px; }
        footer { text-align:center; color:rgba(255,255,255,0.3); font-size:0.75rem; margin-top:20px; }
    </style>
</head>
<body>
<div style="width:100%; max-width:420px;">
    <div class="auth-brand">
        <div class="os-badge"><img src="{% static 'images/opensky_logo.png' %}" alt="Open Sky"></div>
        <div class="brand-text">
            <h1>Open Sky</h1>
            <p>Engineering Team Directory</p>
        </div>
    </div>

    <div class="auth-card">
        <h2>Create Account</h2>
        <p class="subtitle">Register for a new account</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert-error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                    <input type="email" id="email" name="email" placeholder="you@sky.uk" required autocomplete="email">
                </div>
            </div>
            <div class="form-group">
                <label for="password1">Password</label>
                <div class="input-wrap">
                    <input type="password" id="password1" name="password1" placeholder="Create a password" required>
                    <span class="toggle-pw" onclick="togglePw('password1', this)"><i class="bi bi-eye"></i></span>
                </div>
            </div>
            <div class="form-group">
                <label for="password2">Confirm Password</label>
                <div class="input-wrap">
                    <input type="password" id="password2" name="password2" placeholder="Confirm your password" required>
                    <span class="toggle-pw" onclick="togglePw('password2', this)"><i class="bi bi-eye-slash"></i></span>
                </div>
            </div>
            <button type="submit" class="btn-auth">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
        </div>
    </div>
    <footer>© 2025 Sky Engineering Directory</footer>
</div>
<script>
function togglePw(id, el) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
    el.innerHTML = inp.type === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
}
</script>
</body>
</html>
