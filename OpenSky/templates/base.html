<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSky</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">OpenSky</a>
        <div>
            <a class="btn btn-light btn-sm me-2" href="/login/">User Login</a>
            <a class="btn btn-warning btn-sm me-2" href="/login/admin/">Admin Login</a>
            <a class="btn btn-outline-light btn-sm" href="/signup/">Sign Up</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    {% block content %}
    <div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="mb-4 text-center">User Login</h2>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
        </div>
    </div>
</div>
    {% endblock %}
</div>

</body>
</html>
